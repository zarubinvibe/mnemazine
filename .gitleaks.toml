# Generated from scripts/check-public-release.sh.
# Do not hand-edit marker rules here; change PRIVATE_MARKER_RULES_DEFAULT there
# and regenerate with: bash scripts/check-public-release.sh --print-gitleaks-config > .gitleaks.toml

[extend]
useDefault = true

[[allowlists]]
paths = [
  '^scripts/check-public-release\.sh$',
  '^\.gitleaks\.toml$',
]

[[allowlists]]
description = 'Retrieval eval anchors are owner-approved measurement fixtures; keep token rules active, suppress only project/vault marker rules.'
targetRules = ['vault-name-current', 'owner-projects']
paths = [
  '^tests/retrieval-eval\.mjs$',
]

[[rules]]
id = 'private-path'
description = 'Mnemazine private marker: private-path'
regex = '/Users/'
tags = ['mnemazine-private']

[[rules]]
id = 'remote-address'
description = 'Mnemazine private marker: remote-address'
regex = '72\.56'
tags = ['mnemazine-private']

[[rules]]
id = 'remote-root'
description = 'Mnemazine private marker: remote-root'
regex = 'root@[a-z0-9]'
tags = ['mnemazine-private']

[[rules]]
id = 'vault-name-current'
description = 'Mnemazine private marker: vault-name-current'
regex = 'Мозг'
tags = ['mnemazine-private']

[[rules]]
id = 'vault-name-legacy'
description = 'Mnemazine private marker: vault-name-legacy'
regex = 'Полезные знания'
tags = ['mnemazine-private']

[[rules]]
id = 'owner-projects'
description = 'Mnemazine private marker: owner-projects'
regex = 'TODOCUPS|ПКК|AthenaOS|legal-practice|Adventure Book'
tags = ['mnemazine-private']

[[rules]]
id = 'owner-name'
description = 'Mnemazine private marker: owner-name'
regex = 'Филипп'
tags = ['mnemazine-private']

