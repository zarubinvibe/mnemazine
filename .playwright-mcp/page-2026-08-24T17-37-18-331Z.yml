                      - text: "Кстати, у америкосов неделя начинается в воскресенье. Это полный пиздец! Это рвет сознание в клочья, сбивает с толку, полностью лишает возможности ориентироваться в календаре и просто это нелогично. Понятно, что можно было придумать любую организацию дней, хоть 14-дневными кусками. но у нас есть 7-дневная неделя с очень удобными и соответствующими названиями: понедельник - начало, вторник, четверг, пятница - однозначно красиво сформулированные числительные. Не нужно сильно думать, что вторник - второй день в неделе. Со средой тоже удобно - это средний рабочий день без учета выходных. Кстати, почти во всех славянских языках «воскресенье» называется «неделя». Очевидно, этот д"
