                      - text: "Если есть один секрет долговечных отношений, то он такой: первый час после просыпания нужно молчать.Многие люди приходят к пониманию важности этого секрета по-своему. Кто-то просит не говорить с ним до первой чашки кофе, кто-то до прочтения первой газеты, кто-то до пробежки с собакой. Но все это вариации одного и того же явления: после просыпания организму лучше наедине с самим собой, без отвлечения. Это позволяет собраться с мыслями, накопить жизненных сил, поставить мозги на привычные рельсы - и только после этого можно начинать жить день.Это справедливо для любых партнеров в любых сочетаниях. Даже для безногих геев-веганов."
