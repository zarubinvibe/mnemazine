                      - region "Карточка статьи" [ref=f8e585]:
                        - paragraph [ref=f8e588] [cursor=pointer]: "Сегодня все ребята подорвались соблюдать самые разные правила, чтобы быть хорошими. Не все из этих правил имеют смысл. Поэтому приводим краткий список того, что смысл имеет. Причем, не только сегодня, а примерно всегда до конца жизни. Итак: - Нет никакого смысла мыть руки минуту или даже 30 секунд. Достаточно мыть руки 10 секунд. - Температура воды не важна для мытья рук. Важно наличие мыла. - Обычное мыло прекрасно справляется со своей задачей. Нет никакого смысла покупать \"антибактериальное мыло\", потому что обычное мыло помогает смывать почти все микробы и вирусы. - Горячая вода лучше смывает жир, больше она ни для чего не нужна..."
